data:
  path: data/raw/movielens/ml-100k
  strict_counts: true
  max_users: 40
  processed_path: data/processed/movielens-100k-smoke/unified_interactions.csv

model:
  similarity: cosine
  interaction_mode: rating
  neighbor_count: 20

preference:
  positive_rating_threshold: 4.0

evaluation:
  k: [5, 10]

output:
  artifact_root: data/artifacts
  report_root: reports
