data:
  path: data/raw/movielens/ml-100k
  strict_counts: true
  max_users: null
  processed_path: data/processed/movielens-100k/unified_interactions.csv

model:
  similarities: [cosine, jaccard, pearson]
  interaction_mode: rating
  neighbor_count: 50

preference:
  positive_rating_threshold: 4.0

evaluation:
  k: [10, 20, 30]

benchmark:
  enabled: true
  similarity: cosine

output:
  artifact_root: data/artifacts
  report_root: reports
