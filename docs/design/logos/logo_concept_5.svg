<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" fill="none">
  <defs>
    <!-- Heart Gradient: Radiant Coral Rose to Vibrant Crimson -->
    <linearGradient id="heart_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D80"/>
      <stop offset="50%" stop-color="#FF2B66"/>
      <stop offset="100%" stop-color="#E61952"/>
    </linearGradient>
    <!-- Heart Drop Shadow -->
    <filter id="heart_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#FF2B66" flood-opacity="0.36"/>
    </filter>
    <!-- Play Triangle Crisp Shadow -->
    <filter id="play_shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#880026" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Logo Mark Container (52x52) -->
  <g transform="translate(2, 1)">
    <!-- Soft Glass White Base -->
    <rect x="0" y="0" width="50" height="50" rx="15" fill="#FFFFFF"/>
    <rect x="0" y="0" width="50" height="50" rx="15" fill="url(#heart_grad)" fill-opacity="0.06"/>
    <rect x="0.5" y="0.5" width="49" height="49" rx="14.5" stroke="#FF2B66" stroke-opacity="0.18"/>

    <!-- Distinctive Heart Symbol with Clear Play Button -->
    <g filter="url(#heart_shadow)">
      <!-- Unmistakable Heart Silhouette -->
      <path d="M 25 15.5
               C 23.2 12, 19.5 7.5, 13.8 7.5
               C 7.8 7.5, 4 12.8, 4 19.2
               C 4 26.8, 12.5 33.8, 25 42.5
               C 37.5 33.8, 46 26.8, 46 19.2
               C 46 12.8, 42.2 7.5, 36.2 7.5
               C 30.5 7.5, 26.8 12, 25 15.5 Z"
            fill="url(#heart_grad)" />

      <!-- Subtle Specular Reflection for 3D Depth -->
      <path d="M 13.8 9.5
               C 9.2 9.5, 6 13.8, 6 19.2
               C 6 22.5, 8.2 26.2, 12 29.8
               C 10 26, 9.5 22, 9.5 19.2
               C 9.5 15, 11.5 11.5, 15.5 10.5
               C 14.9 9.8, 14.3 9.5, 13.8 9.5 Z"
            fill="#FFFFFF" fill-opacity="0.3" />

      <!-- Crystal Clear, Bold Play Button (▶) -->
      <path d="M 20.5 16
               C 19.4 15.3, 18 16.1, 18 17.4
               L 18 30.6
               C 18 31.9, 19.4 32.7, 20.5 32
               L 32 25.4
               C 33.1 24.7, 33.1 23.3, 32 22.6
               Z"
            fill="#FFFFFF"
            filter="url(#play_shadow)" />
    </g>
  </g>

  <!-- Wordmark: HuTube -->
  <g transform="translate(64, 35)">
    <text font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="800" font-size="27" letter-spacing="-0.6px" fill="#111827">Hu</text>
    <text x="36" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="800" font-size="27" letter-spacing="-0.6px" fill="#FF2B66">Tube</text>
    <!-- Sweet Heart Accent Spark -->
    <path d="M 104 -10 C 104 -12 106 -13 107.5 -11.5 C 109 -13 111 -12 111 -10 C 111 -8 107.5 -6 107.5 -6 C 107.5 -6 104 -8 104 -10 Z" fill="#FF2B66" />
  </g>
</svg>
