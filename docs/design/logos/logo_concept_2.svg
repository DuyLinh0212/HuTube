<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" fill="none">
  <defs>
    <!-- Concept 2 Gradients: Warm Sunset Sunrise Stream -->
    <linearGradient id="c2_grad_loop1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2B66"/>
      <stop offset="60%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>
    <linearGradient id="c2_grad_loop2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF2B66"/>
      <stop offset="70%" stop-color="#D91E5B"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="c2_grad_accent" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFA800"/>
      <stop offset="100%" stop-color="#FF2B66"/>
    </linearGradient>
    <filter id="c2_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#FF6B35" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Logo Mark Container (52x52) -->
  <g transform="translate(2, 1)">
    <!-- Soft Warm Squircle Base -->
    <rect x="0" y="0" width="50" height="50" rx="15" fill="#FFFFFF" />
    <rect x="0" y="0" width="50" height="50" rx="15" fill="url(#c2_grad_loop1)" fill-opacity="0.08" />
    <rect x="0.5" y="0.5" width="49" height="49" rx="14.5" stroke="#FFA800" stroke-opacity="0.25" />

    <!-- Icon: Continuous Creative Möbius / Infinite Video Wave -->
    <g filter="url(#c2_shadow)">
      <!-- Outer Flowing Ribbon forming 'H' and infinity flow -->
      <path d="M 12 15 C 12 11 15 8 19 8 C 23 8 26 11 26 15 L 26 23 C 27 20 30 18 34 18 C 39 18 42 22 42 27 L 42 35 C 42 39 39 42 35 42 C 31 42 28 39 28 35 L 28 27 C 27 30 24 32 20 32 C 15 32 12 28 12 23 Z"
            fill="url(#c2_grad_loop1)" fill-rule="evenodd" opacity="0.95"/>

      <!-- Center Forward Play Notch Fold -->
      <path d="M 21 19 L 32 25 L 21 31 Z" fill="#FFFFFF" fill-opacity="0.95" />
      <path d="M 21 19 L 27 22.5 L 21 26 Z" fill="url(#c2_grad_accent)" opacity="0.5" />
    </g>
  </g>

  <!-- Wordmark: HuTube -->
  <g transform="translate(64, 35)">
    <text font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="800" font-size="27" letter-spacing="-0.6px" fill="#111827">Hu</text>
    <text x="36" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="800" font-size="27" letter-spacing="-0.6px" fill="#FF2B66">Tube</text>
    <!-- Warm Spark Accent -->
    <circle cx="106" cy="-8" r="3" fill="#FFA800" />
  </g>
</svg>
