<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" fill="none">
  <defs>
    <!-- Concept 4 Gradients: HyperTube Velocity (Neon Coral to Cyber Violet & Cyan) -->
    <linearGradient id="c4_tube_left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="40%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>
    <linearGradient id="c4_tube_right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1361"/>
      <stop offset="60%" stop-color="#FF4E50"/>
      <stop offset="100%" stop-color="#F9D423"/>
    </linearGradient>
    <linearGradient id="c4_play_glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1361"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
    <filter id="c4_neon_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#FF1361" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Logo Mark Container (52x52) -->
  <g transform="translate(2, 1)">
    <!-- Sleek Tech Base -->
    <rect x="0" y="0" width="50" height="50" rx="16" fill="#0F172A" />
    <rect x="0.5" y="0.5" width="49" height="49" rx="15.5" stroke="url(#c4_play_glow)" stroke-opacity="0.4" />

    <!-- Icon: 3D Isometric Neon Tube forming 'H' + Velocity Play -->
    <g filter="url(#c4_neon_shadow)">
      <!-- Left Cyber Tube -->
      <path d="M 12 11 C 12 9.5 13.5 8.5 15 9.2 L 19 11.2 C 20.2 11.8 21 13 21 14.4 L 21 38 C 21 39.7 19.3 41 17.6 40.2 L 13.6 38.2 C 12.6 37.7 12 36.7 12 35.6 Z"
            fill="url(#c4_tube_left)" />

      <!-- Right Coral Tube -->
      <path d="M 33 11 C 33 9.5 34.5 8.5 36 9.2 L 40 11.2 C 41.2 11.8 42 13 42 14.4 L 42 38 C 42 39.7 40.3 41 38.6 40.2 L 34.6 38.2 C 33.6 37.7 33 36.7 33 35.6 Z"
            fill="url(#c4_tube_right)" />

      <!-- Velocity Play Cross-Portal -->
      <path d="M 18 19 L 32 25 L 18 31 Z" fill="#FFFFFF" />
      <path d="M 23 21.5 L 30.5 25 L 23 28.5 Z" fill="url(#c4_tube_right)" />

      <!-- Cyan Speed Particle -->
      <circle cx="35" cy="25" r="2" fill="#00F2FE" />
    </g>
  </g>

  <!-- Wordmark: HuTube -->
  <g transform="translate(64, 35)">
    <text font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="800" font-size="27" letter-spacing="-0.6px" fill="#111827">Hu</text>
    <text x="36" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="800" font-size="27" letter-spacing="-0.6px" fill="#FF1361">Tube</text>
    <!-- Cyber Cyan Dot -->
    <circle cx="106" cy="-8" r="3" fill="#00F2FE" />
  </g>
</svg>
