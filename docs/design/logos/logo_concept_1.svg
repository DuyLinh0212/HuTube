<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" fill="none">
  <defs>
    <!-- Concept 1 Gradients -->
    <linearGradient id="c1_pillar_left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D80"/>
      <stop offset="100%" stop-color="#FF2B66"/>
    </linearGradient>
    <linearGradient id="c1_pillar_right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2B66"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="c1_play_bridge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2B66"/>
      <stop offset="50%" stop-color="#FF6584"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <filter id="c1_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#FF2B66" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Logo Mark Container (52x52) -->
  <g transform="translate(2, 1)">
    <!-- Soft Glass Squircle Base -->
    <rect x="0" y="0" width="50" height="50" rx="15" fill="#FFFFFF" />
    <rect x="0" y="0" width="50" height="50" rx="15" fill="url(#c1_play_bridge)" fill-opacity="0.08" />
    <rect x="0.5" y="0.5" width="49" height="49" rx="14.5" stroke="#FF2B66" stroke-opacity="0.2" />

    <!-- Icon: H-Play Dynamic Kinetic Emblem -->
    <!-- Left Pillar (Creator) -->
    <rect x="10" y="10" width="8" height="30" rx="4" fill="url(#c1_pillar_left)" />

    <!-- Right Pillar (Community) -->
    <rect x="32" y="10" width="8" height="30" rx="4" fill="url(#c1_pillar_right)" />

    <!-- Kinetic Forward Play Chevron bridging the pillars -->
    <path d="M 16 17 C 16 15.6 17.5 14.8 18.7 15.5 L 29.8 22.8 C 30.8 23.5 30.8 25.1 29.8 25.8 L 18.7 33.1 C 17.5 33.8 16 33.0 16 31.6 Z"
          fill="url(#c1_play_bridge)" filter="url(#c1_shadow)"/>

    <!-- Core Spark Highlight -->
    <circle cx="21" cy="24.3" r="2.2" fill="#FFFFFF" fill-opacity="0.9" />
  </g>

  <!-- Wordmark: HuTube -->
  <g transform="translate(64, 35)">
    <!-- 'Hu' in dark bold slate -->
    <text font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="800" font-size="27" letter-spacing="-0.6px" fill="#111827">Hu</text>
    <!-- 'Tube' in Coral Brand color -->
    <text x="36" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="800" font-size="27" letter-spacing="-0.6px" fill="#FF2B66">Tube</text>
    <!-- Subtitle / Dot -->
    <circle cx="106" cy="-8" r="3" fill="#7C3AED" />
  </g>
</svg>
