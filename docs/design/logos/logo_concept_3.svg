<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" fill="none">
  <defs>
    <!-- Concept 3 Gradients: Prism Lens / Multi-perspective Iris -->
    <linearGradient id="c3_blade1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2B66"/>
      <stop offset="100%" stop-color="#FF5E8A"/>
    </linearGradient>
    <linearGradient id="c3_blade2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="c3_blade3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="c3_play_center" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF0F5"/>
    </linearGradient>
    <filter id="c3_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7C3AED" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Logo Mark Container (52x52) -->
  <g transform="translate(2, 1)">
    <!-- Soft Squircle Base -->
    <rect x="0" y="0" width="50" height="50" rx="15" fill="#FFFFFF" />
    <rect x="0.5" y="0.5" width="49" height="49" rx="14.5" stroke="#E5E7EB" />

    <!-- Icon: 3-Blade Interlocking Aperture Lens with Center Play Diamond -->
    <g filter="url(#c3_shadow)">
      <!-- Blade 1 (Top / Pink) -->
      <path d="M 12 14 C 18 10 32 10 38 15 C 33 22 25 24 18 20 Z" fill="url(#c3_blade1)" opacity="0.95" />

      <!-- Blade 2 (Right / Violet) -->
      <path d="M 38 16 C 42 22 42 36 36 41 C 31 34 30 25 33 17 Z" fill="url(#c3_blade2)" opacity="0.95" />

      <!-- Blade 3 (Bottom-Left / Cyan-Indigo) -->
      <path d="M 12 36 C 8 30 10 16 16 12 C 19 20 25 26 20 34 Z" fill="url(#c3_blade3)" opacity="0.92" />

      <!-- Center Faceted Play Arrow / Lens Focus -->
      <path d="M 21 19 C 21 17.8 22.4 17.1 23.4 17.7 L 33.2 23.6 C 34.1 24.2 34.1 25.6 33.2 26.2 L 23.4 32.1 C 22.4 32.7 21 32.0 21 30.8 Z"
            fill="url(#c3_play_center)" />
      <!-- Play facet shadow -->
      <path d="M 21 19 L 29 24.9 L 21 30.8 Z" fill="#FF2B66" fill-opacity="0.25" />
    </g>
  </g>

  <!-- Wordmark: HuTube -->
  <g transform="translate(64, 35)">
    <text font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="800" font-size="27" letter-spacing="-0.6px" fill="#111827">Hu</text>
    <text x="36" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="800" font-size="27" letter-spacing="-0.6px" fill="#FF2B66">Tube</text>
    <!-- Cyan Diamond Accent -->
    <circle cx="106" cy="-8" r="3" fill="#06B6D4" />
  </g>
</svg>
