<aside class="side-nav" [class.is-collapsed]="collapsed" aria-label="Điều hướng HuTube">
  <div class="side-nav__head">
    <a class="brand" routerLink="/account" aria-label="HuTube">
      <img src="/assets/logo-mark.png" alt="" />
      <span><strong>Hu</strong><em>Tube</em></span>
    </a>
    <button class="sidebar-toggle" type="button" (click)="toggleCollapsed()" [attr.aria-label]="collapsed ? 'Mở rộng sidebar' : 'Thu gọn sidebar'" [attr.aria-pressed]="collapsed">
      <span aria-hidden="true">{{ collapsed ? '›' : '‹' }}</span>
    </button>
    <button class="nav-close" type="button" aria-label="Đóng menu" (click)="closeNavigation()">×</button>
  </div>

  <nav class="nav-groups">
    <section class="nav-group" aria-label="Khám phá">
      <p class="nav-label">Khám phá</p>
      <a class="nav-item" routerLink="/account" (click)="closeNavigation()" title="Trang chủ">
        <img src="/assets/icons/home.png" alt="" />
        <span>Trang chủ</span>
      </a>
      <span class="nav-item" title="Khám phá">
        <img src="/assets/icons/compass.png" alt="" />
        <span>Khám phá</span>
      </span>
      <span class="nav-item" title="Kênh đăng ký">
        <img src="/assets/icons/channel.png" alt="" />
        <span>Kênh đăng ký</span>
      </span>
    </section>

    <section class="nav-group" aria-label="Thư viện">
      <p class="nav-label">Thư viện</p>
      <span class="nav-item" title="Lịch sử xem">
        <img src="/assets/icons/history.png" alt="" />
        <span>Lịch sử xem</span>
      </span>
      <span class="nav-item" title="Video đã thích">
        <img src="/assets/icons/favorite.png" alt="" />
        <span>Video đã thích</span>
      </span>
      <span class="nav-item" title="Danh sách phát">
        <img src="/assets/icons/playlist.png" alt="" />
        <span>Danh sách phát</span>
      </span>
    </section>

    <section class="nav-group" aria-label="Kênh của bạn">
      <p class="nav-label">Kênh của bạn</p>
      <a class="nav-item" (click)="openMyChannel()" style="cursor: pointer;" title="Kênh của bạn">
        <img src="/assets/icons/my_channel.png" alt="" />
        <span>Kênh của bạn</span>
      </a>
      <a class="nav-item nav-item--cta" routerLink="/channel/create" (click)="closeNavigation()" routerLinkActive="active" title="Tạo kênh mới">
        <span class="nav-icon-badge">+</span>
        <span>Tạo kênh mới</span>
      </a>
    </section>

    <section class="nav-group" aria-label="Cài đặt">
      <p class="nav-label">Cài đặt</p>
      <a class="nav-item" routerLink="/account" (click)="closeNavigation()" routerLinkActive="active" title="Hồ sơ & Tài khoản">
        <img src="/assets/icons/setting.png" alt="" />
        <span>Hồ sơ cá nhân</span>
      </a>
    </section>
  </nav>
</aside>
