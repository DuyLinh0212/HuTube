<header class="topbar">
  <button class="menu-button" type="button" [attr.aria-label]="'nav.openMenu' | translate" (click)="menuOpened.emit()">
    <span></span><span></span><span></span>
  </button>

  <a class="mobile-mark" routerLink="/account" aria-label="HuTube Quản trị">
    <img src="/assets/logo-mark.png" alt="" />
  </a>

  <label class="search-box">
    <span class="search-glyph" aria-hidden="true"></span>
    <input type="search" [placeholder]="'topbar.searchPlaceholder' | translate" [attr.aria-label]="'topbar.searchPlaceholder' | translate" />
  </label>

  <div class="top-actions" aria-label="Thông tin quản trị">
    <span class="date-range">{{ 'topbar.dateRange' | translate }}</span>

    <!-- Theme Toggle -->
    <button class="topbar-icon-btn" type="button" (click)="toggleTheme()" [title]="themeService.currentTheme() === 'dark' ? ('topbar.themeLight' | translate) : ('topbar.themeDark' | translate)">
      @if (themeService.currentTheme() === 'dark') {
        <span>☀️</span>
      } @else {
        <span>🌙</span>
      }
    </button>

    <!-- Language Toggle -->
    <button class="topbar-icon-btn lang-btn" type="button" (click)="toggleLanguage()" [title]="'topbar.language' | translate">
      <span>{{ i18n.currentLang() === 'vi' ? 'VI' : 'EN' }}</span>
    </button>

    <span class="notification" role="img" [attr.aria-label]="'8 ' + ('topbar.notifications' | translate)">
      <img src="/assets/icons/notification.png" alt="" />
      <i>8</i>
    </span>

    <a class="admin-profile" routerLink="/account">
      <span class="profile-avatar">{{ auth.user()?.displayName?.slice(0, 1)?.toUpperCase() || 'Q' }}</span>
      <span>
        <strong>{{ auth.user()?.displayName || ('topbar.adminRole' | translate) }}</strong>
        <small>{{ 'topbar.adminRole' | translate }}</small>
      </span>
    </a>
  </div>
</header>
