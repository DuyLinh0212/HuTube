name: HuTube CI

on:
  push:
    branches: [develop, "feature/**", "fix/**", "ci/**", "test/**", "db/**"]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: "Deploy develop to the configured Render staging service after all checks pass"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hutube-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  recommendation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: recommendation-service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: recommendation-service/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hutube_test
          POSTGRES_PASSWORD: ci-only-isolated-password
          POSTGRES_DB: hutube_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hutube_test -d hutube_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_CONNECTION: Host=localhost;Port=5432;Database=hutube_test;Username=hutube_test;Password=ci-only-isolated-password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore backend/HuTube.sln
      - run: dotnet build backend/HuTube.sln --no-restore --configuration Release
      - name: Unit tests
        run: dotnet test backend/tests/HuTube.UnitTests --no-build --configuration Release --logger trx
      - name: Integration tests against PostgreSQL
        run: dotnet test backend/tests/HuTube.IntegrationTests --no-build --configuration Release --logger trx
      - name: Publish API
        run: dotnet publish backend/src/HuTube.Api --no-restore --configuration Release --output artifacts/api
      - uses: actions/upload-artifact@v6
        with:
          name: api-${{ github.sha }}
          path: artifacts/api
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-test-results
          path: backend/tests/**/TestResults/*.trx

  web:
    strategy:
      fail-fast: false
      matrix:
        client: [user-web, admin-web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/${{ matrix.client }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.client }}/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.client }}-${{ github.sha }}
          path: frontend/${{ matrix.client }}/dist

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: mobile
    env:
      # Public runtime values for the APK. Override these in the GitHub
      # Environment named `mobile` when the deployed API/client changes.
      MOBILE_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL || 'https://hutube.onrender.com/api/v1' }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || '968220896298-or85f9g8ibu45tdbf0svsbiqt54g7iml.apps.googleusercontent.com' }}
    defaults:
      run:
        working-directory: mobile/user-app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Validate mobile release configuration
        shell: bash
        run: |
          [[ "$MOBILE_API_BASE_URL" == https://* ]] || { echo 'MOBILE_API_BASE_URL must use HTTPS for the CI APK.'; exit 1; }
          [[ "$GOOGLE_WEB_CLIENT_ID" == *.apps.googleusercontent.com ]] || { echo 'GOOGLE_WEB_CLIENT_ID is invalid.'; exit 1; }
      - name: Setup release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'androiddebugkey' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "=== Decoding keystore from GitHub Secret ANDROID_KEYSTORE_BASE64 ==="
            mkdir -p "$RUNNER_TEMP/keystore"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "=== Keystore decoded successfully. Certificate fingerprints: ==="
            keytool -list -v -keystore "$RUNNER_TEMP/keystore/release.keystore" -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA1:|SHA256:"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not found in GitHub Secrets. Falling back to local/default debug keystore."
          fi
      - name: Build release APK
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/hutube-mobile-defines.json" <<EOF
          {"API_BASE_URL":"$MOBILE_API_BASE_URL","GOOGLE_WEB_CLIENT_ID":"$GOOGLE_WEB_CLIENT_ID"}
          EOF
          flutter build apk --release --build-number=${{ github.run_number }} \
            --dart-define-from-file="$RUNNER_TEMP/hutube-mobile-defines.json"
          echo "=== Kiem tra chu ky thuc te cua APK vua build ==="
          apk="build/app/outputs/flutter-apk/app-release.apk"
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$android_sdk" ]; then
            echo 'ANDROID_HOME and ANDROID_SDK_ROOT are both unset.'
            exit 1
          fi
          apksigner="$(find "$android_sdk/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo 'Android SDK build-tools apksigner was not found.'
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$apk"
      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: hutube-user-app-apk-${{ github.sha }}
          path: mobile/user-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  e2e:
    needs: [backend, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/user-web/package-lock.json
            frontend/admin-web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: frontend/e2e_testing/requirements.txt
      - name: Install PostgreSQL 18 binaries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl postgresql-common
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: %s\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$VERSION_CODENAME" "$(dpkg --print-architecture)" \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-18 ffmpeg
          test -x /usr/lib/postgresql/18/bin/initdb
          echo 'E2E_POSTGRES_BIN=/usr/lib/postgresql/18/bin' >> "$GITHUB_ENV"
      - name: Install browser and project dependencies
        shell: bash
        run: |
          npm ci --prefix frontend/user-web
          npm ci --prefix frontend/admin-web
          python -m pip install --requirement frontend/e2e_testing/requirements.txt
          python -m pip install openpyxl==3.1.5
          python -m playwright install --with-deps chromium
      - name: Verify runner port lifecycle
        run: python -m unittest discover -s frontend/e2e_testing/tests -p test_runner_ports.py -v
      - name: Run existing authentication E2E
        run: python frontend/e2e_testing/run_local.py
      - name: Run User and Admin Web functional E2E
        if: ${{ !cancelled() }}
        run: python frontend/e2e_testing/run_local.py --suite web --reuse-build
      - name: Export User and Admin Excel report
        if: ${{ !cancelled() }}
        run: python frontend/e2e_testing/coverage/export_ci_report.py
      - name: Verify Web result and screenshot consistency
        if: ${{ !cancelled() }}
        run: python frontend/e2e_testing/coverage/verify_web_evidence.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: hutube-e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/e2e_testing/artifacts/runs/*/*report.json
            frontend/e2e_testing/artifacts/runs/*/*.xlsx
            frontend/e2e_testing/artifacts/runs/*/downloads/*.csv
            frontend/e2e_testing/artifacts/web-latest.json
            frontend/e2e_testing/screenshots/20*/**
          if-no-files-found: warn
          retention-days: 14

  container:
    needs: [recommendation, backend, web, mobile, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.ref == 'refs/heads/develop' && github.event_name != 'pull_request' }}
          build-args: HUTUBE_COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_staging && github.ref == 'refs/heads/develop'
    needs: [container]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - name: Validate staging settings
        shell: bash
        run: |
          test -n "$RENDER_DEPLOY_HOOK" || { echo 'Configure the staging RENDER_DEPLOY_HOOK secret.'; exit 1; }
          test -n "$STAGING_API_URL" || { echo 'Configure the staging STAGING_API_URL variable.'; exit 1; }
          [[ "$RENDER_DEPLOY_HOOK" == https://api.render.com/deploy/* ]] || { echo 'Expected a Render HTTPS deploy hook.'; exit 1; }
          [[ "$STAGING_API_URL" == https://* ]] || { echo 'Staging API requires HTTPS.'; exit 1; }
      - name: Deploy (Render pre-deploy command applies migrations)
        shell: bash
        run: curl --fail --silent --show-error --max-time 30 --get --data-urlencode "ref=$EXPECTED_COMMIT" "$RENDER_DEPLOY_HOOK" > /dev/null
      - name: Wait for expected revision and smoke test
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent --max-time 10 "${STAGING_API_URL%/}/health" > /dev/null; then
              actual=$(curl --fail --silent --max-time 10 "${STAGING_API_URL%/}/api/v1/system/info" | jq -r '.commitSha // empty') || actual=''
              if [ "$actual" = "$EXPECTED_COMMIT" ]; then
                echo 'Expected deployment is healthy and responds to the shared client diagnostic endpoint.'
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Expected staging revision did not become healthy. Inspect Render deploy and migration logs.'
          exit 1
