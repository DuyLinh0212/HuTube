name: HuTube CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "ci/**", "test/**", "db/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hutube-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  deployment-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify EC2 deployment gates and recovery
        run: python -m unittest discover -s scripts/deploy/tests -v
      - name: Verify E2E runner APT source configuration
        run: python -m unittest discover -s scripts/ci/tests -v
      - name: Validate installer syntax
        run: |
          for script in scripts/deploy/install-ec2-autodeploy.sh scripts/deploy/install-ec2-rabbitmq.sh scripts/deploy/install-ec2-fcm.sh scripts/deploy/install-local-rabbitmq-wsl.sh; do
            bash -n "$script"
          done
      - name: Verify Git owner transition with the service sandbox
        shell: bash
        run: |
          sudo systemd-run --unit=dalitu-cd-check-${{ github.run_id }}-${{ github.run_attempt }} \
            --wait --collect --pipe -p User=root -p UMask=0077 \
            -p NoNewPrivileges=false -p PrivateTmp=true \
            -p ProtectKernelTunables=true -p ProtectKernelModules=true -p ProtectControlGroups=true \
            /usr/bin/python3 -c 'import subprocess,sys; subprocess.run(["runuser","-u",sys.argv[1],"--","git","-C",sys.argv[2],"rev-parse","--is-inside-work-tree"],check=True)' \
            "$(id -un)" "$GITHUB_WORKSPACE"

  recommendation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: recommendation-service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: recommendation-service/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      rabbitmq:
        image: rabbitmq:4.3.6-management
        env:
          RABBITMQ_DEFAULT_USER: dalitu
          RABBITMQ_DEFAULT_PASS: ci-only-isolated-broker-password
          RABBITMQ_DEFAULT_VHOST: dalitu
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 10s --health-retries 18
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hutube_test
          POSTGRES_PASSWORD: ci-only-isolated-password
          POSTGRES_DB: hutube_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hutube_test -d hutube_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_CONNECTION: Host=localhost;Port=5432;Database=hutube_test;Username=hutube_test;Password=ci-only-isolated-password
      TEST_RABBITMQ_HOST: 127.0.0.1
      TEST_RABBITMQ_PASSWORD: ci-only-isolated-broker-password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore backend/HuTube.sln
      - run: dotnet build backend/HuTube.sln --no-restore --configuration Release
      - name: Unit tests
        run: dotnet test backend/tests/HuTube.UnitTests --no-build --configuration Release --logger trx
      - name: Integration tests against PostgreSQL
        run: dotnet test backend/tests/HuTube.IntegrationTests --no-build --configuration Release --logger trx
      - name: Publish API
        run: dotnet publish backend/src/HuTube.Api --no-restore --configuration Release --output artifacts/api
      - uses: actions/upload-artifact@v6
        with:
          name: api-${{ github.sha }}
          path: artifacts/api
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/tests/**/TestResults/*.trx
            backend/tests/**/TestResults/performance/*.json

  web:
    strategy:
      fail-fast: false
      matrix:
        client: [user-web, admin-web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/${{ matrix.client }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.client }}/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.client }}-${{ github.sha }}
          path: frontend/${{ matrix.client }}/dist

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: mobile
    env:
      # Public runtime values for the APK. Override these in the GitHub
      # Environment named `mobile` when either deployed service changes.
      MOBILE_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL || 'https://api.dalitu.app/api/v1' }}
      MOBILE_RECOMMENDATION_BASE_URL: ${{ vars.MOBILE_RECOMMENDATION_BASE_URL || 'https://recommendation.dalitu.app/api/v1' }}
      MOBILE_AUTH_WEB_BASE_URL: ${{ vars.MOBILE_AUTH_WEB_BASE_URL || 'https://dalitu.app' }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || '968220896298-or85f9g8ibu45tdbf0svsbiqt54g7iml.apps.googleusercontent.com' }}
    defaults:
      run:
        working-directory: mobile/user-app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Validate mobile release configuration
        shell: bash
        run: |
          [[ "$MOBILE_API_BASE_URL" == https://* ]] || { echo 'MOBILE_API_BASE_URL must use HTTPS for the CI APK.'; exit 1; }
          [[ "$MOBILE_RECOMMENDATION_BASE_URL" == https://* ]] || { echo 'MOBILE_RECOMMENDATION_BASE_URL must use HTTPS for the CI APK.'; exit 1; }
          [[ "$MOBILE_AUTH_WEB_BASE_URL" == https://* ]] || { echo 'MOBILE_AUTH_WEB_BASE_URL must use HTTPS for the CI APK.'; exit 1; }
          [[ "$GOOGLE_WEB_CLIENT_ID" == *.apps.googleusercontent.com ]] || { echo 'GOOGLE_WEB_CLIENT_ID is invalid.'; exit 1; }
      - name: Setup release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'androiddebugkey' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "=== Decoding keystore from GitHub Secret ANDROID_KEYSTORE_BASE64 ==="
            mkdir -p "$RUNNER_TEMP/keystore"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "=== Keystore decoded successfully. Certificate fingerprints: ==="
            keytool -list -v -keystore "$RUNNER_TEMP/keystore/release.keystore" -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA1:|SHA256:"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not found in GitHub Secrets. Falling back to local/default debug keystore."
          fi
      - name: Build release APK
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/hutube-mobile-defines.json" <<EOF
          {"API_BASE_URL":"$MOBILE_API_BASE_URL","RECOMMENDATION_BASE_URL":"$MOBILE_RECOMMENDATION_BASE_URL","AUTH_WEB_BASE_URL":"$MOBILE_AUTH_WEB_BASE_URL","GOOGLE_WEB_CLIENT_ID":"$GOOGLE_WEB_CLIENT_ID","FIREBASE_API_KEY":"$FIREBASE_API_KEY","FIREBASE_APP_ID":"$FIREBASE_APP_ID","FIREBASE_PROJECT_ID":"$FIREBASE_PROJECT_ID","FIREBASE_MESSAGING_SENDER_ID":"$FIREBASE_MESSAGING_SENDER_ID"}
          EOF
          flutter build apk --release --build-number=${{ github.run_number }} \
            --dart-define-from-file="$RUNNER_TEMP/hutube-mobile-defines.json"
          echo "=== Kiem tra chu ky thuc te cua APK vua build ==="
          apk="build/app/outputs/flutter-apk/app-release.apk"
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$android_sdk" ]; then
            echo 'ANDROID_HOME and ANDROID_SDK_ROOT are both unset.'
            exit 1
          fi
          apksigner="$(find "$android_sdk/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo 'Android SDK build-tools apksigner was not found.'
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$apk"
      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: hutube-user-app-apk-${{ github.sha }}
          path: mobile/user-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  e2e:
    needs: [backend, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/user-web/package-lock.json
            frontend/admin-web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: frontend/e2e_testing/requirements.txt
      - name: Install PostgreSQL 18 and media dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          # Handle both direct Ubuntu sources and the runner's mirror+file URI.
          # These settings also apply to Playwright's later apt installs.
          sudo python3 scripts/ci/prepare_e2e_apt.py
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 60 --retry 3 \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nArchitectures: %s\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$VERSION_CODENAME" "$(dpkg --print-architecture)" \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-18 ffmpeg
          test -x /usr/lib/postgresql/18/bin/initdb
          /usr/lib/postgresql/18/bin/initdb --version
          /usr/lib/postgresql/18/bin/pg_ctl --version
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version
          echo 'E2E_POSTGRES_BIN=/usr/lib/postgresql/18/bin' >> "$GITHUB_ENV"
      - name: Install browser and project dependencies
        shell: bash
        run: |
          npm ci --prefix frontend/user-web
          npm ci --prefix frontend/admin-web
          python -m pip install --requirement frontend/e2e_testing/requirements.txt
          python -m pip install openpyxl==3.1.5
          python -m playwright install --with-deps chromium
      - name: Verify runner port lifecycle
        id: e2e_setup
        run: python -m unittest discover -s frontend/e2e_testing/tests -p test_runner_ports.py -v
      - name: Run existing authentication E2E
        run: python frontend/e2e_testing/run_local.py
      - name: Run User and Admin Web functional E2E
        if: ${{ !cancelled() && steps.e2e_setup.outcome == 'success' }}
        run: python frontend/e2e_testing/run_local.py --suite web --reuse-build
      - name: Run all Admin permission allow and deny scenarios
        if: ${{ !cancelled() && steps.e2e_setup.outcome == 'success' }}
        run: python frontend/e2e_testing/run_local.py --suite rbac --reuse-build
      - name: Verify Admin permission matrix and browser evidence
        if: ${{ !cancelled() && steps.e2e_setup.outcome == 'success' }}
        run: python frontend/e2e_testing/coverage/verify_rbac_evidence.py
      - name: Verify Admin recovery from missing lazy modules
        if: ${{ !cancelled() && steps.e2e_setup.outcome == 'success' }}
        run: python scripts/ui-regression/admin-chunk-recovery.py --root frontend/admin-web/dist/admin-web/browser --artifacts frontend/e2e_testing/artifacts/chunk-recovery
      - name: Verify watch recommendations and retry
        if: ${{ !cancelled() && steps.e2e_setup.outcome == 'success' }}
        run: python scripts/ui-regression/watch-recommendations.py --root frontend/user-web/dist/user-web/browser --artifacts frontend/e2e_testing/artifacts/watch-recommendations
      - name: Verify channel and watch infinite scroll
        if: ${{ !cancelled() && steps.e2e_setup.outcome == 'success' }}
        run: python scripts/ui-regression/channel-watch-scroll.py --root frontend/user-web/dist/user-web/browser --artifacts frontend/e2e_testing/artifacts/channel-watch-scroll
      - name: Verify player menu, comments and hourly analytics
        if: ${{ !cancelled() && steps.e2e_setup.outcome == 'success' }}
        run: python scripts/ui-regression/player-hourly-comments.py --root frontend/user-web/dist/user-web/browser --video mobile/user-app/test/fixtures/download-sample.mp4 --artifacts frontend/e2e_testing/artifacts/player-hourly
      - name: Export User and Admin Excel report
        if: ${{ !cancelled() && steps.e2e_setup.outcome == 'success' }}
        run: python frontend/e2e_testing/coverage/export_ci_report.py
      - name: Verify Web result and screenshot consistency
        if: ${{ !cancelled() && steps.e2e_setup.outcome == 'success' }}
        run: python frontend/e2e_testing/coverage/verify_web_evidence.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: hutube-e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/e2e_testing/artifacts/runs/*/*report.json
            frontend/e2e_testing/artifacts/runs/*/*.xlsx
            frontend/e2e_testing/artifacts/runs/*/downloads/*.csv
            frontend/e2e_testing/artifacts/web-latest.json
            frontend/e2e_testing/artifacts/rbac-latest.json
            frontend/e2e_testing/artifacts/runs/*/rbac-coverage.json
            frontend/e2e_testing/artifacts/chunk-recovery/**/*.json
            frontend/e2e_testing/artifacts/watch-recommendations/**/*.json
            frontend/e2e_testing/artifacts/channel-watch-scroll/**/*.json
            frontend/e2e_testing/artifacts/player-hourly/**/*.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: hutube-e2e-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/e2e_testing/screenshots/20*/**/*.png
            frontend/e2e_testing/artifacts/chunk-recovery/**/*.png
            frontend/e2e_testing/artifacts/watch-recommendations/**/*.png
            frontend/e2e_testing/artifacts/channel-watch-scroll/**/*.png
            frontend/e2e_testing/artifacts/player-hourly/**/*.png
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

  container:
    needs: [recommendation, backend, web, mobile, e2e, deployment-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: api
        with:
          context: backend
          platforms: linux/amd64
          push: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name != 'pull_request' }}
          build-args: HUTUBE_COMMIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.dalitu.service=api
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ github.ref == 'refs/heads/main' && 'main' || 'develop' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Recommendation Service image
        uses: docker/build-push-action@v6
        id: recommendation
        with:
          context: recommendation-service
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          build-args: HUTUBE_COMMIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.dalitu.service=recommendation
          # The existing public package lets EC2 pull both services without a PAT.
          tags: ${{ steps.image.outputs.name }}:recommendation-${{ github.sha }}
          cache-from: type=gha,scope=recommendation
          cache-to: type=gha,mode=max,scope=recommendation
      - name: Record production image digests
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.name }}
          COMMIT_SHA: ${{ github.sha }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          RECOMMENDATION_DIGEST: ${{ steps.recommendation.outputs.digest }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          images = {}
          for service in ('api', 'recommendation'):
              digest = os.environ[service.upper() + '_DIGEST']
              if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
                  raise SystemExit('Missing published image digest: ' + service)
              images[service] = os.environ['IMAGE_REPOSITORY'] + '@' + digest
          manifest = {'sha': os.environ['COMMIT_SHA'], 'images': images}
          Path('ec2-images.json').write_text(json.dumps(manifest, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('EC2 production images for ' + manifest['sha'] + '\n\n')
              for service, image in images.items():
                  summary.write('- ' + service + ': `' + image + '`\n')
          PY
      - uses: actions/upload-artifact@v6
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: ec2-images-${{ github.sha }}
          path: ec2-images.json
          if-no-files-found: error
          retention-days: 14
