services:
  - type: web
    name: hutube-api
    runtime: docker
    region: singapore
    plan: free
    branch: develop
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Staging
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__Database
        sync: false
      - key: Jwt__SigningKey
        generateValue: true
      - key: Jwt__Issuer
        value: HuTube
      - key: Jwt__Audience
        value: HuTube.Clients
      - key: Auth__WebBaseUrl
        sync: false
      - key: Auth__AdminBaseUrl
        sync: false
      - key: Auth__AllowedOrigins__0
        value: http://localhost:4200
      - key: Auth__AllowedOrigins__1
        value: http://localhost:4201
      # Render's ingress uses private 10/8 addresses. Trust forwarded client IPs
      # only from that explicitly configured ingress network.
      - key: ForwardedHeaders__KnownNetworks__0
        value: 10.0.0.0/8
      - key: Google__ClientId
        sync: false
      - key: Storage__Provider
        value: Cloudinary
      - key: Storage__CloudName
        sync: false
      - key: Storage__ApiKey
        sync: false
      - key: Storage__ApiSecret
        sync: false
      - key: Storage__R2__AccountId
        sync: false
      - key: Storage__R2__AccessKeyId
        sync: false
      - key: Storage__R2__SecretAccessKey
        sync: false
      - key: Storage__R2__BucketName
        value: hutube
      - key: Storage__R2__ReadUrlMinutes
        value: "60"
      - key: Recommendation__Enabled
        value: "true"
      - key: Recommendation__ServiceUrl
        sync: false
      - key: Recommendation__ServiceToken
        sync: false
      - key: Recommendation__AdminToken
        sync: false
      - key: VideoProcessing__Enabled
        value: "true"
      - key: VideoProcessing__FfmpegPath
        value: ffmpeg
      - key: Features__ModerationEnabled
        value: "false"
      - key: Features__PlanEnforcementEnabled
        value: "true"
      - key: Email__Mode
        value: Smtp
      - key: Email__Host
        sync: false
      - key: Email__Port
        value: "587"
      - key: Email__From
        sync: false
      - key: Email__Username
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__Gmail__ClientId
        sync: false
      - key: Email__Gmail__ClientSecret
        sync: false
      - key: Email__Gmail__RefreshToken
        sync: false
  - type: web
    name: hutube-recommendation-service
    runtime: docker
    region: singapore
    plan: free
    branch: develop
    dockerContext: ./recommendation-service
    dockerfilePath: ./recommendation-service/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: MODEL_TYPE
        value: item_based_cosine
      - key: RECOMMENDER_SERVICE_TOKEN
        sync: false
      - key: RECOMMENDER_ADMIN_TOKEN
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: hutube
